<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Câmera remota — Fonte OBS</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent!important}
#cameraRemoteVideo{position:absolute;inset:0;border:0;width:100%;height:100%;background:transparent}
#cameraRemoteVideo{object-fit:contain}
#cameraViewerStatus{display:none}
body.debug #cameraViewerStatus{display:block;position:fixed;bottom:8px;left:8px;right:8px;padding:12px;background:rgba(11,18,34,.91);color:#fff;z-index:100;font:14px/1.4 system-ui,sans-serif;border-radius:8px;pointer-events:none}
</style>
</head>
<body>
<video id="cameraRemoteVideo" autoplay muted playsinline style="visibility:hidden"></video>
<div id="cameraViewerStatus" role="status">Aguardando câmera do console…</div>
<script src="/camera-viewer.js"></script>
</body></html>
