<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Console · Painel ao Vivo</title><link rel="stylesheet" href="style.css"></head><body><header><strong>✦ PAINEL AO VIVO</strong><span id="status">Configurando…</span><a href="visualizacao.html" target="_blank" rel="noopener">Abrir visualização ↗</a></header><main class="layout"><section class="card"><h1>Console de edição</h1><p>O texto e a aparência são sincronizados com a outra tela.</p><div id="login"><label>E-mail de administrador<input id="email" type="email" autocomplete="username"></label><label>Senha<input id="senha" type="password" autocomplete="current-password"></label><button id="entrar">Entrar</button></div><div id="editor" hidden><div class="topline"><small>Editor conectado</small><button class="secondary" id="sair">Sair</button></div><label>Texto exibido<textarea id="texto" rows="6" maxlength="10000" placeholder="Escreva aqui..."></textarea></label><div class="controls"><label>Fonte<select id="fonte"><option value="Arial, sans-serif">Arial</option><option value="Georgia, serif">Georgia</option><option value="Verdana, sans-serif">Verdana</option><option value="'Courier New', monospace">Courier New</option><option value="system-ui, sans-serif">Sistema</option></select></label><label>Tamanho (px)<input id="tamanho" type="number" min="16" max="180" value="64"></label><label>Cor do texto<input id="cor" type="color" value="#ffffff"></label><label>Cor do fundo<input id="fundo" type="color" value="#0e1628"></label><label>Alinhamento<select id="alinhamento"><option value="center">Centro</option><option value="left">Esquerda</option><option value="right">Direita</option></select></label><label>Espessura<select id="peso"><option value="400">Normal</option><option value="700">Negrito</option></select></label></div><div class="actions"><button id="publicar">Enviar agora</button><label class="check"><input id="automatico" type="checkbox" checked> Atualização automática</label></div></div><p id="erro" role="alert"></p></section><section class="card preview-card"><div class="topline"><h2>Prévia</h2><span>Visualização local</span></div><div id="preview" class="preview">Seu texto aparecerá aqui</div><p class="hint">O link de visualização pode ser aberto em outro computador ou celular.</p></section></main><script type="module" src="console.js"></script></body></html>
