<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V2J · Central de retorno</title>
<style>
*[hidden]{display:none!important}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;min-height:100%;font:clamp(15px,1.9vw,25px)/1.4 system-ui,sans-serif;background:#08111e;color:#eff6ff}
body{overflow:auto}.shell{min-height:100vh;padding:clamp(10px,2vw,28px);display:grid;grid-template-rows:auto minmax(240px,1.1fr) minmax(240px,1fr) auto;gap:clamp(8px,1.5vw,18px)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900;letter-spacing:.08em;font-size:clamp(20px,3vw,42px)}.status{color:#8fdbbf;font-size:.68em}
.panel{min-width:0;overflow:hidden;background:#14243b;border:1px solid #2b4466;border-radius:16px;padding:clamp(13px,2vw,25px)}
h2{font-size:1.08em;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between}.tag{color:#79e7b4;font-size:.65em;font-weight:600}
.chat{display:flex;flex-direction:column;min-height:0}.messages{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:9px;scrollbar-color:#4d6687 transparent}
.message{background:#1e3553;padding:10px 13px;border-radius:11px;overflow-wrap:anywhere}.message strong{color:#9bcbff}.message small{color:#a8b9cc;font-size:.7em;margin-left:8px}.message p{margin:3px 0 0;white-space:pre-wrap}
.empty{color:#abc0d8;font-style:italic}.product{display:flex;flex-direction:column;min-height:0}.product-body{display:flex;gap:clamp(10px,2vw,24px);min-height:0;flex:1}.product-images{width:38%;max-width:380px;min-width:0;display:flex;flex-direction:column;gap:7px}.main-img{height:100%;width:100%;min-height:150px;object-fit:contain;background:#0b192b;border-radius:12px}.thumbs{display:flex;gap:6px;overflow:auto}.thumbs img{height:65px;width:55px;object-fit:cover;border-radius:7px;cursor:pointer;border:2px solid transparent}.thumbs img.selected{border-color:#7cc9ff}
.product-info{flex:1;min-width:0;overflow:auto}.name{font-size:1.27em;font-weight:800;overflow-wrap:anywhere}.price{font-size:1.1em;color:#83edb9;font-weight:800;margin:6px 0}.product-meta{font-size:.88em;font-weight:650;color:#e0eeff;margin:10px 0;display:flex;gap:9px;flex-wrap:wrap;line-height:1.35}.product-meta span{background:#223b59;border:1px solid #3c5878;border-radius:9px;padding:7px 11px}.product-meta .low{background:#733e2e;color:#ffe0aa}.desc{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:10px}
.notice{background:#264b73;border-color:#4a9cce}.notice h2{color:#c9eaff}.notice-content{font-size:1.18em;font-weight:750;white-space:pre-wrap;overflow-wrap:anywhere}
@media (min-aspect-ratio:1/1){.shell{grid-template-columns:1fr 1fr;grid-template-rows:auto minmax(0,1fr) auto;height:100vh}.top{grid-column:1/-1}.chat{grid-column:1;grid-row:2}.product{grid-column:2;grid-row:2}.product-body{flex-direction:column}.product-images{width:100%;max-width:none;max-height:45%;flex-direction:row}.main-img{width:auto;max-width:70%;height:100%}.thumbs{flex-direction:column}.notice{grid-column:1/-1;grid-row:3}}
@media (max-width:600px){.product-body{flex-direction:column}.product-images{width:100%;max-width:none;height:230px;flex-direction:row}.main-img{width:auto;max-width:75%;min-height:0}.thumbs{flex-direction:column}}
</style></head><body>
<main class="shell">
<header class="top"><div class="brand">✦ V2J <span style="color:#8fbefa">RETORNO LIVE</span></div><span class="status" id="status">Conectando…</span></header>
<section class="panel chat"><h2>💬 Chat da LIVE <span class="tag" id="chatCount">MANUAL</span></h2><div class="messages" id="messages"><div class="empty">Aguardando mensagens do console…</div></div></section>
<section class="panel product"><h2>🛍️ Produto em apresentação <span class="tag">FICHA DO PRODUTO</span></h2><div class="product-body"><div class="product-images" id="productImages" hidden><img id="mainImage" class="main-img" alt="Imagem do produto"><div class="thumbs" id="thumbs"></div></div><div class="product-info"><div class="name" id="name">Nenhum produto selecionado</div><div class="price" id="price"></div><div class="product-meta" id="productMeta"></div><a id="productLink" href="#" target="_blank" rel="noopener noreferrer" hidden style="display:inline-block;margin:6px 0;color:#a4d5ff;font-size:.72em">↗ Abrir ficha no TikTok Shop</a><div class="desc" id="desc">Cadastre as informações no console V2J.</div></div></div></section>
<section class="panel notice"><h2>📣 Recado para a apresentadora <span class="tag">PRIORIDADE</span></h2><div class="notice-content" id="notice">Nenhum recado no momento.</div></section>
</main><script src="/central-viewer.js" defer></script></body></html>
