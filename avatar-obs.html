<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Avatar Astronauta — Fonte OBS</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#stage{display:block;width:100%;height:100%;background:transparent;object-fit:contain}
#status{position:fixed;left:0;right:0;bottom:0;text-align:center;font:14px system-ui;color:#c7d9ff;background:#101b39d9;padding:9px;pointer-events:none}
#status[hidden]{display:none}
</style></head>
<body><canvas id="stage" aria-label="Astronauta neon que acompanha movimentos, sem mostrar a câmera real"></canvas>
<div id="status" hidden></div>
<script>
(()=>{
'use strict';
const params=new URLSearchParams(location.search);
const room=params.get('room')||'';
const validRoom=/^[a-f0-9]{32}$/.test(room);
const background=params.get('background')!=='0';
const debug=params.get('debug')==='1';
const canvas=document.getElementById('stage'),ctx=canvas.getContext('2d',{alpha:true});
const label=document.getElementById('status');
label.hidden=!debug;
let target=null,received=0,stopped=false,polling=false,localFrame=0;
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(x,min,max)=>Math.min(max,Math.max(min,x));
const rnd=seed=>{const v=Math.sin(seed*127.1+seed*seed*.11)*43758.5453;return v-Math.floor(v)};
const stars=Array.from({length:260},(_,i)=>({
 x:rnd(i*7+2)*1000,y:rnd(i*5+11)*800,r:.4+rnd(i*3+9)*2.1,
 a:.3+rnd(i*6+13)*.7,c:i%5===0?'#ff67f4':i%4===0?'#49ddff':'#e0dbff'
}));
const points={nose:[.5,.27,1],leftShoulder:[.37,.49,1],rightShoulder:[.63,.49,1],
 leftElbow:[.3,.65,1],rightElbow:[.7,.65,1],
 leftWrist:[.25,.78,1],rightWrist:[.75,.78,1],
 leftHip:[.42,.83,1],rightHip:[.58,.83,1]};
let smoothed={...Object.fromEntries(Object.entries(points).map(([k,v])=>[k,[...v]]))};
let frameTime=0;
const colour={
 hot:'#ff46db',blue:'#27e5ff',white:'#f5efff',dark:'#080824',shadow:'#22254c'
};
function resize(){
 const w=Math.max(2,canvas.clientWidth),h=Math.max(2,canvas.clientHeight);
 const dpr=Math.min(1.25,window.devicePixelRatio||1);
 const newW=Math.round(w*dpr),newH=Math.round(h*dpr);
 if(canvas.width!==newW||canvas.height!==newH){canvas.width=newW;canvas.height=newH;}
}
window.addEventListener('resize',resize);resize();
async function poll(){
 if(!validRoom||polling)return;
 polling=true;
 try{
  const r=await fetch('/api/avatar-pose?room='+room,{cache:'no-store'});
  if(!r.ok)throw Error('HTTP '+r.status);
  const data=await r.json();
  if(data.active&&data.points){target=data.points;received=Date.now();stopped=false;}
  else if(data.active===false){target=null;stopped=true;}
 }catch{}
 finally{polling=false;}
}
function point(name){
 const p=smoothed[name]||points[name];
 return {x:1-clamp(Number(p?.[0]??.5),0,1),y:clamp(Number(p?.[1]??.5),0,1),v:clamp(Number(p?.[2]??0),0,1)};
}
function nextTargets(){
 if(!target||Date.now()-received>9500)return;
 const strength=.18;
 for(const key of Object.keys(points)){
  if(!Array.isArray(target[key])||target[key].length!==3)continue;
  const prev=smoothed[key];
  if(target[key][2]<.32)continue;
  for(let i=0;i<2;i++)prev[i]=lerp(prev[i],target[key][i],strength);
  prev[2]=target[key][2];
 }
}
function rgbaGlow(x,y,rad,col,alpha=1){
 const g=ctx.createRadialGradient(x,y,0,x,y,rad);
 g.addColorStop(0,col);g.addColorStop(1,'transparent');
 ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=g;ctx.fillRect(x-rad,y-rad,rad*2,rad*2);ctx.restore();
}
function drawStars(t){
 const g=ctx.createRadialGradient(500,370,50,500,380,740);
 g.addColorStop(0,'#240d56');g.addColorStop(.38,'#0d0d38');g.addColorStop(1,'#020616');
 ctx.fillStyle=g;ctx.fillRect(0,0,1000,800);
 rgbaGlow(290+Math.sin(t*.03)*40,400,330,'#a900ff',.2);
 rgbaGlow(790+Math.sin(t*.02)*40,245,250,'#ff00bb',.3);
 rgbaGlow(520,280,300,'#008efa',.24);
 for(const star of stars){
  ctx.save();ctx.globalAlpha=star.a*(.7+.3*Math.sin(t*.65+star.x*.08));
  ctx.fillStyle=star.c;ctx.beginPath();ctx.arc(star.x,star.y,star.r,0,Math.PI*2);ctx.fill();ctx.restore();
 }
 // Halo galáctico atrás do capacete, lembrando a referência enviada.
 ctx.save();ctx.translate(500,380);ctx.rotate(-.19);
 const halo=ctx.createLinearGradient(-310,-310,310,290);
 halo.addColorStop(0,'#2bd6ff');halo.addColorStop(.32,'#c918ed');
 halo.addColorStop(.7,'#ff36a8');halo.addColorStop(1,'#209bff');
 ctx.strokeStyle=halo;ctx.lineWidth=13;ctx.shadowColor='#ff39d9';ctx.shadowBlur=39;
 ctx.beginPath();ctx.ellipse(0,0,365,320,0,Math.PI*1.02,Math.PI*2.98);ctx.stroke();
 ctx.lineWidth=4;ctx.strokeStyle='#48e6ff';ctx.shadowBlur=18;
 ctx.beginPath();ctx.ellipse(0,0,384,337,0,.0,Math.PI*2);ctx.stroke();
 ctx.restore();
}
function grad(x,y,r,c1,c2){
 const g=ctx.createRadialGradient(x-r*.3,y-r*.4,r*.08,x,y,r);
 g.addColorStop(0,c1);g.addColorStop(1,c2);return g;
}
function roundRect(x,y,w,h,r,fill,stroke,width=2){
 ctx.beginPath();ctx.roundRect(x,y,w,h,r);
 if(fill){ctx.fillStyle=fill;ctx.fill();}
 if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke();}
}
function line(a,b,width,color,glow){
 ctx.save();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';
 if(glow){ctx.shadowColor=glow;ctx.shadowBlur=14;}
 ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.restore();
}
function arm(side,elbow,wrist,shoulder){
 const bright=side==='left'?colour.blue:colour.hot;
 const p1=shoulder,p2=elbow,p3=wrist;
 line(p1,p2,84,grad(p2.x,p2.y,115,'#f2c9f8','#303359'));
 line(p2,p3,71,grad(p3.x,p3.y,100,'#b6d8f8','#232348'));
 line(p1,p2,5,bright,bright);line(p2,p3,5,bright,bright);
 for(const p of [p1,p2]){
  ctx.fillStyle=grad(p.x,p.y,35,'#eef4ff','#393254');
  ctx.beginPath();ctx.arc(p.x,p.y,34,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=bright;ctx.lineWidth=5;ctx.stroke();
 }
 ctx.save();ctx.translate(p3.x,p3.y);ctx.rotate(Math.atan2(p3.y-p2.y,p3.x-p2.x));
 roundRect(-32,-24,65,48,18,grad(0,0,65,'#dcd4ef','#303153'),bright,3);
 for(let i=-1;i<=1;i++)roundRect(16,i*12-4,27,8,4,'#bfcbef','#56d5ff',1);
 ctx.restore();
}
function helmet(cx,cy,tilt,t){
 ctx.save();ctx.translate(cx,cy);ctx.rotate(tilt);
 ctx.shadowColor='#ff59e0';ctx.shadowBlur=25;
 ctx.fillStyle=grad(-15,-20,205,'#f5a8eb','#7d5699');
 ctx.beginPath();ctx.ellipse(0,0,177,207,0,0,Math.PI*2);ctx.fill();
 ctx.shadowBlur=0;
 ctx.strokeStyle='#eb81ef';ctx.lineWidth=9;ctx.stroke();
 // Reflexo escuro do visor, com universo luminoso e nunca um rosto real.
 const glass=ctx.createLinearGradient(-130,-96,135,115);
 glass.addColorStop(0,'#12092d');glass.addColorStop(.36,'#0d1754');glass.addColorStop(.75,'#23104c');glass.addColorStop(1,'#05091e');
 ctx.fillStyle=glass;ctx.beginPath();ctx.ellipse(0,36,146,130,0,0,Math.PI*2);ctx.fill();
 ctx.save();ctx.clip();
 rgbaGlow(-25+Math.sin(t*.3)*11,60,118,'#fd2bc1',.7);
 rgbaGlow(85,13,110,'#12baf7',.65);
 rgbaGlow(0,102,92,'#9526f7',.5);
 for(let i=0;i<75;i++){
  const xx=rnd(i*18+5)*290-145,yy=rnd(i*24+11)*240-82;
  ctx.fillStyle=i%3===0?'#ff6dec':'#bce9ff';
  ctx.globalAlpha=.5+.5*rnd(i*6+3);
  ctx.fillRect(xx,yy,1.2+(i%3),1.2+(i%3));
 }
 ctx.restore();
 ctx.save();ctx.shadowColor=colour.blue;ctx.shadowBlur=16;
 ctx.strokeStyle='#42e3ff';ctx.lineWidth=5;
 ctx.beginPath();ctx.ellipse(0,36,148,132,0,0,Math.PI*2);ctx.stroke();
 ctx.restore();
 ctx.strokeStyle='#ffe9f9';ctx.lineWidth=6;
 ctx.beginPath();ctx.ellipse(-52,-8,76,62,-.55,3.95,5.45);ctx.stroke();
 // Fivela frontal e anéis de suporte.
 roundRect(-96,162,192,40,15,grad(0,165,170,'#ccbeee','#35325e'),'#e86cf5',4);
 roundRect(-42,181,84,17,7,'#3c2d65','#45ceff',2);
 for(const x of [-165,165]){
  ctx.fillStyle='#baa6d5';ctx.beginPath();ctx.arc(x,70,19,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=colour.hot;ctx.lineWidth=5;ctx.stroke();
 }
 ctx.restore();
}
function drawAvatar(t){
 const l=point('leftShoulder'),r=point('rightShoulder'),nose=point('nose');
 const shoulderCenterX=(l.x+r.x)*.5,shoulderCenterY=(l.y+r.y)*.5;
 const dist=Math.max(.12,Math.abs(l.x-r.x));
 const factor=clamp(270/dist,670,1600);
 const centerX=500+clamp((shoulderCenterX-.5)*230,-80,80);
 const centerY=480+clamp((shoulderCenterY-.46)*120,-45,45);
 // O usuário está de frente para a câmera: braços e mãos se posicionam
 // conforme o lado real detectado, sem cruzar o peito quando a imagem é espelhada.
 const L={x:centerX+clamp((l.x-shoulderCenterX)*factor,-205,205),y:centerY};
 const R={x:centerX+clamp((r.x-shoulderCenterX)*factor,-205,205),y:centerY};
 const map=(part,name)=>{
  const p=point(name);
  const anchor=part==='left'?L:R;
  const outward=anchor.x>=centerX?1:-1;
  const defaultElbow={x:anchor.x+outward*95,y:centerY+120};
  const defaultWrist={x:anchor.x+outward*145,y:centerY+205};
  const fallback=name.includes('Elbow')?defaultElbow:defaultWrist;
  if(p.v<.35)return fallback;
  return{
   x:clamp(centerX+(p.x-shoulderCenterX)*factor,46,954),
   y:clamp(centerY+(p.y-shoulderCenterY)*factor,170,760)
  };
 };
 const le=map('left','leftElbow'),lw=map('left','leftWrist');
 const re=map('right','rightElbow'),rw=map('right','rightWrist');
 // Braços por trás do tronco, mas à frente do cenário.
 arm('left',le,lw,L);arm('right',re,rw,R);
 const armor=ctx.createLinearGradient(centerX-150,centerY-20,centerX+150,centerY+330);
 armor.addColorStop(0,'#d5a6da');armor.addColorStop(.42,'#8b8bb9');armor.addColorStop(1,'#212348');
 ctx.shadowColor='#ba4fea';ctx.shadowBlur=16;
 roundRect(centerX-162,centerY-30,324,330,90,armor,'#c678f3',6);
 ctx.shadowBlur=0;
 // Peitoral robótico.
 roundRect(centerX-116,centerY+78,232,144,40,grad(centerX-12,centerY+150,152,'#6d6ca7','#282143'),'#2adafd',3);
 roundRect(centerX-72,centerY+104,144,74,18,grad(centerX,centerY+110,110,'#2b2165','#050b20'),'#e02fe1',3);
 ctx.save();ctx.shadowColor='#26ebff';ctx.shadowBlur=20;
 ctx.fillStyle='#66e8ff';ctx.beginPath();ctx.arc(centerX,centerY+142,23,0,Math.PI*2);ctx.fill();
 ctx.restore();
 for(let i=0;i<4;i++){
  ctx.fillStyle=i%2?'#e24af6':'#27ccff';
  roundRect(centerX-78+i*44,centerY+206,22,13,6,ctx.fillStyle,null);
 }
 const headX=centerX+clamp((nose.x-shoulderCenterX)*factor*.28,-55,55);
 const headY=centerY-177+clamp((nose.y-shoulderCenterY+.24)*90,-28,28);
 const tilt=clamp((l.y-r.y)*.9,-.18,.18);
 helmet(headX,headY,tilt,t);
}
function draw(time){
 requestAnimationFrame(draw);
 if(time-frameTime<46)return;
 frameTime=time;
 resize();
 const cw=canvas.width,ch=canvas.height;
 ctx.clearRect(0,0,cw,ch);
 const sx=cw/1000,sy=ch/800,scale=Math.min(sx,sy);
 const x0=(cw-1000*scale)*.5,y0=(ch-800*scale)*.5;
 ctx.save();ctx.translate(x0,y0);ctx.scale(scale,scale);
 if(background)drawStars(time/1000);
 nextTargets();
 drawAvatar(time/1000);
 ctx.restore();
 if(debug){
  const age=received?Math.round((Date.now()-received)/1000):'-';
  label.textContent='Avatar astronauta | '+(received&&age<8?'Movimentos conectados':'Aguardando celular')+
   ' | Atualizado há: '+age+'s | Imagem real nunca enviada';
 }
}
requestAnimationFrame(draw);
if(validRoom){poll();setInterval(poll,530);}
else if(debug){label.textContent='Abra avatar-camera.html para obter uma sessão segura.';}
})();
</script></body></html>
