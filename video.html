<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vídeo ao Vivo — Painel ao Vivo</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:#080b12;color:#fff;font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column}
#video{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
.barra{display:flex;align-items:center;gap:12px;padding:10px 15px;min-height:62px;background:#151e31;border-top:1px solid #39425a;flex-wrap:wrap}
#aviso{flex:1;color:#dfe7fb;font-size:14px;overflow-wrap:anywhere}
button{cursor:pointer;background:#476afa;border:0;border-radius:8px;padding:10px 13px;color:#fff;font-weight:700}
#reproduzirManual[hidden]{display:none}
#detalhe{font-size:12px;color:#b8c5e2;padding:6px 15px;min-height:20px}
</style></head><body>
<video id="video" playsinline muted controls preload="metadata"></video>
<div class="barra"><span id="aviso" role="status">Aguardando vídeo do console…</span><button id="reproduzirManual" hidden>▶ Iniciar vídeo</button></div>
<div id="detalhe"></div>
<script src="video-viewer.js"></script></body></html>
