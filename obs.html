<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OBS · Texto transparente</title>
<link rel="stylesheet" href="/texto-efeitos.css">
<style>
html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden}
body{display:grid;justify-items:center;align-items:center}
#conteudo{box-sizing:border-box;width:100%;max-height:100%;padding:3vw;display:flex;flex-direction:column;align-items:stretch;background:transparent!important;overflow:visible}
#imagem{display:none;flex:none;max-width:100%;height:auto;object-fit:contain;align-self:center;margin:0 auto 10px}
#texto{color:#fff;font:700 64px/1.25 Arial,sans-serif;text-align:center;overflow-wrap:anywhere;white-space:pre-wrap}
/* Retorno vertical para TikTok LIVE (9:16), sem distorcer o sinal. */
#retornoTela{position:fixed;top:50%;left:50%;width:min(100vw,56.25vh);height:min(100vh,177.7778vw);aspect-ratio:9/16;transform:translate(-50%,-50%);border:0;background:#080e19;display:none}
/* Tablets em paisagem usam a área inteira; no celular permanece retrato 9:16. */
@media (min-aspect-ratio: 1/1){
 #retornoTela{width:min(100vw,56.25vh);height:min(100vh,177.7778vw);aspect-ratio:9/16}
}
body.modo-tela #retornoTela{display:block}
body.modo-tela #conteudo{display:none}
#ajusteTela{display:none;position:fixed;right:12px;bottom:12px;z-index:90;gap:7px;align-items:center;padding:8px;border-radius:12px;background:rgba(9,16,30,.86);color:white;font:600 14px system-ui}
#ajusteTela button{color:white;background:#345c9f;border:0;border-radius:8px;font-size:20px;min-width:42px;min-height:40px;cursor:pointer}
body.modo-tela.mostrar-ajuste #ajusteTela{display:flex}
</style>
</head>
<body>
<div id="conteudo"><img id="imagem" alt=""><div id="texto"></div></div>
<iframe id="retornoTela" title="Tela do OBS no retorno" allow="autoplay; fullscreen; picture-in-picture" referrerpolicy="no-referrer" aria-label="Transmissão da câmera virtual OBS"></iframe>
<div id="ajusteTela" aria-label="Ajustar tamanho do vídeo"><button id="menosZoom" aria-label="Reduzir zoom">−</button><span id="zoomValor">170%</span><button id="maisZoom" aria-label="Ampliar zoom">+</button></div>
<script type="module" src="/obs.js"></script>
<script src="/retorno-obs.js" defer></script>
</body></html>
