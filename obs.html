<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OBS · Texto transparente</title>
<link rel="stylesheet" href="/texto-efeitos.css">
<style>
html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden}
body{display:grid;justify-items:center;align-items:center}
#conteudo{box-sizing:border-box;width:100%;max-height:100%;padding:3vw;display:flex;flex-direction:column;align-items:stretch;background:transparent!important;overflow:visible}
#imagem{display:none;flex:none;max-width:100%;height:auto;object-fit:contain;align-self:center;margin:0 auto 10px}
#texto{color:#fff;font:700 64px/1.25 Arial,sans-serif;text-align:center;overflow-wrap:anywhere;white-space:pre-wrap}
#retornoTela{position:fixed;inset:0;width:100%;height:100%;border:0;background:#080e19;display:none}
body.modo-tela #retornoTela{display:block}
body.modo-tela #conteudo{display:none}
</style>
</head>
<body>
<div id="conteudo"><img id="imagem" alt=""><div id="texto"></div></div>
<iframe id="retornoTela" title="Tela do OBS no retorno" allow="autoplay; fullscreen; picture-in-picture" referrerpolicy="no-referrer" aria-label="Transmissão da câmera virtual OBS"></iframe>
<script type="module" src="/obs.js"></script>
<script src="/retorno-obs.js" defer></script>
</body></html>
