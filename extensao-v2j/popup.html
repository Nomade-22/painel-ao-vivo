<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{width:310px;background:#0e1727;color:#f7f9ff;font:14px system-ui;margin:0;padding:18px;box-sizing:border-box}h1{font-size:18px;margin:0 0 6px}.muted{color:#aabbd0;font-size:12px;line-height:1.45}.stat{background:#1b2b42;padding:12px;border-radius:10px;margin:14px 0}.big{font-size:30px;font-weight:750}button{display:block;width:100%;margin:8px 0;padding:11px;border:0;border-radius:9px;background:#1ed6b0;color:#08221b;font-weight:750;cursor:pointer}button.secondary{background:#31445d;color:white}button:disabled{opacity:.5;cursor:wait}#message{margin:10px 0;overflow-wrap:anywhere;font-size:12px}a{color:#80cbff}</style></head>
<body><h1>🛍️ V2J · Sacolinha</h1><div class="muted">Abra o Gerenciador de LIVE e deixe a lista dos itens visível.</div>
<div class="stat"><div class="big" id="count">—</div><div class="muted">Itens encontrados na página</div></div>
<button id="scan">Ler sacolinha agora</button><button id="send" class="secondary">Enviar ao V2J</button><button id="auto" class="secondary">Ativar leitura automática</button>
<div id="message" role="status">Aguardando leitura.</div>
<div class="stat" style="margin-top:15px"><strong>Importação de detalhes (teste com 5 itens)</strong>
<div class="muted" id="batchStatus" style="margin:8px 0">Ainda não iniciada.</div>
<button id="batchStart" class="secondary">Importar próximos 5</button>
<button id="batchStop" class="secondary" style="display:none">Parar importação</button>
</div>
<a href="https://painel-ao-vivo-jhonatan23.vercel.app/central-controle.html" target="_blank" rel="noopener">Abrir Central V2J</a>
<script src="popup.js"></script></body></html>
