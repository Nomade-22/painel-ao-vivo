<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Câmera remota — saída limpa</title>
<style>
html,body{width:100%;height:100%;margin:0;background:transparent!important;overflow:hidden}
#cameraRemoteVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:transparent;visibility:hidden}
#cameraViewerStatus{display:none}
body.debug #cameraViewerStatus{display:block;position:fixed;left:8px;bottom:8px;right:8px;z-index:50;background:rgba(12,20,36,.88);color:#fff;padding:12px;border-radius:8px;font:14px system-ui,sans-serif;pointer-events:none}
</style>
</head>
<body>
<video id="cameraRemoteVideo" autoplay muted playsinline></video>
<div id="cameraViewerStatus" role="status">Aguardando vídeo da câmera…</div>
<script src="/camera-viewer.js"></script>
</body>
</html>
