<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Câmera — visualizador sem controles</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
#cameraRemoteFrame{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;display:block}
#cameraRemoteFrame[hidden]{display:none!important}
#cameraViewerStatus{display:none}
body.debug #cameraViewerStatus{display:block;position:fixed;bottom:9px;left:9px;right:9px;z-index:100;padding:12px;background:rgba(7,16,32,.9);border-radius:8px;color:#fff;font:14px/1.4 system-ui;pointer-events:none}
</style></head><body>
<iframe id="cameraRemoteFrame" title="Câmera remota" allow="autoplay; picture-in-picture; fullscreen; encrypted-media" allowtransparency="true" referrerpolicy="no-referrer" hidden></iframe>
<div id="cameraViewerStatus">Aguardando câmera do celular…</div>
<script src="/camera-viewer.js"></script>
</body></html>
