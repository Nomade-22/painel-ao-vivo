<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Visualizador YouTube para OBS</title>
<style>
html,body{height:100%;width:100%;margin:0;overflow:hidden;background:#080808;color:white;font-family:system-ui,Arial,sans-serif}
body{display:flex;justify-content:center;align-items:center}
#stage{width:min(100vw,177.77778vh);aspect-ratio:16/9;position:relative;background:#000}
#yt-container,#yt-player,#yt-container iframe{width:100%!important;height:100%!important;display:block;border:0}
#message{position:fixed;bottom:12px;left:12px;right:12px;padding:12px 16px;background:rgba(18,27,46,.94);border:1px solid #47628a;border-radius:10px;color:#dce8fa;font-size:14px;line-height:1.5;text-align:center;max-width:760px;margin:auto;overflow-wrap:anywhere}
#message[hidden]{display:none}
</style>
</head>
<body>
<div id="stage"><div id="yt-container"><div id="yt-player"></div></div></div>
<div id="message" role="status">Aguardando um link no painel de controle do YouTube…</div>
<script src="/youtube-obs.js" defer></script>
<script src="https://www.youtube.com/iframe_api"></script>
</body></html>
